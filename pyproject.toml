[project]
name = "embloks"
version = "0.1.0"
description = "Grid-based electromagnetism sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
embloks = "embloks.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
