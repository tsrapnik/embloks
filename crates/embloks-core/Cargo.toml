[package]
name = "embloks-core"
description = "Grid-based electromagnetism sandbox: world, physics reference (f64), scenes and saves"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miniz_oxide = "0.9.1"
ndarray = "0.17.2"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = { version = "0.10.3", default-features = false }
rand_pcg = "0.10.2"
rustdct = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
web-time = "1.1.0"

[dev-dependencies]
approx = "0.5.1"
