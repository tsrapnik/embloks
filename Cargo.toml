[workspace]
members = ["crates/embloks-core", "crates/embloks-gpu", "crates/embloks-web"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[profile.dev]
# The physics is unusably slow unoptimised; keep debug info but optimise.
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
